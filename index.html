<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Server Website</title>
        <style>
            :root {
                --bg-color: #121212;
                --sidebar-bg: #181818;
                --text-main: #e0e0e0;
                --text-muted: #888888;
                --border-color: #2a2a2a;
                --title-color: #00ffa3;
                --button-bg: #333333;
                --hover-color: #747574;
            }
            .light-mode {
                --bg-color: #ffffff;
                --sidebar-bg: #f4f4f4;
                --text-main: #121212;
                --text-muted: #666666;
                --border-color: #cccccc;
                --title-color: #00b372;
                --button-bg: #e0e0e0;
                --hover-color: #bbbbbb;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                background-color: var(--bg-color);
                color: var(--text-main);
                min-height: 100vh;
                display: flex;
                transition: background-color 0.2s, color 0.2s;
                overflow-x: hidden;
            }
            .sidebar {
                width: 60px;
                height: 100vh;
                background-color: var(--sidebar-bg);
                border-right: 1px solid var(--border-color);
                display: flex;
                flex-direction: column;
                padding: 1rem 0.5rem;
                gap: 0.5rem;
                flex-shrink: 0;
                transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                overflow: hidden;
                white-space: nowrap;
                position: relative;
                z-index: 10;
            }
            .sidebar:hover {
                width: 220px;
            }
            .sidebar-header {
                display: flex;
                align-items: center;
                gap: 1rem;
                padding: 0.5rem;
                margin-bottom: 1rem;
            }
            .sidebar-logo {
                width: 24px;
                height: 24px;
                min-width: 24px;
                background-color: var(--title-color);
                border-radius: 4px;
            }
            .sidebar-title {
                font-size: 0.9rem;
                font-weight: bold;
                color: var(--text-main);
                opacity: 0;
                transition: opacity 0.2s ease;
            }
            .sidebar:hover .sidebar-title {
                opacity: 1;
            }
            .nav-link {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0.75rem;
                color: var(--text-main);
                text-decoration: none;
                border-radius: 8px;
                font-size: 0.95rem;
                font-weight: 500;
                background: var(--button-bg);
                transition: background 0.2s, transform 0.1s;
            }
            .nav-item-left {
                display: flex;
                align-items: center;
                gap: 1rem;
            }
            .nav-icon {
                font-size: 1.1rem;
                min-width: 24px;
                text-align: center;
            }
            .nav-label {
                opacity: 0;
                transition: opacity 0.2s ease;
            }
            .sidebar:hover .nav-label {
                opacity: 1;
            }
            .nav-link::after {
                content: "›";
                font-size: 1.2rem;
                color: var(--text-muted);
                opacity: 0;
                transition: opacity 0.2s ease, transform 0.2s;
            }
            .sidebar:hover .nav-link::after {
                opacity: 1;
            }
            .nav-link:hover {
                background: var(--hover-color);
                color: #121212;
            }
            .nav-link:hover::after {
                color: #121212;
                transform: translateX(2px);
            }
            .main-wrapper {
                flex: 1;
                display: flex;
                flex-direction: column;
            }
            header {
                display: flex;
                justify-content: flex-end;
                padding: 1.5rem 2rem;
                width: 100%;
            }
            .toggle-btn {
                background: var(--button-bg);
                color: var(--text-main);
                border: 1px solid var(--border-color);
                padding: 0.6rem 1.2rem;
                border-radius: 8px;
                font-weight: bold;
                cursor: pointer;
                transition: background 0.2s;
            }
            .toggle-btn:hover {
                background: var(--hover-color);
                color: #121212;
            }
            .Main {
                text-align: center;
                margin: auto;
                max-width: 600px;
                padding: 0 1rem;
            }
            h1 {
                color: var(--title-color);
                font-size: 2.5rem;
                margin-bottom: 0.5rem;
            }
            .Main p {
                color: var(--text-muted);
                font-size: 1.1rem;
            }
        </style>
    </head>
    <body>
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo"></div>
                <span class="sidebar-title">Pages Menu</span>
            </div>

            <a href="/ntfy/" class="nav-link">
                <span class="nav-item-left">
                    <span class="nav-icon">N</span>
                    <span class="nav-label">NTFY</span>
                </span>
            </a>

            <a href="https://saloraxz.github.io" class="nav-link">
                <span class="nav-item-left">
                    <span class="nav-icon">GP</span>
                    <span class="nav-label">Github Pages</span>
                </span>
            </a>

            <a href="/love/" class="nav-link">
                <span class="nav-item-left">
                    <span class="nav-icon">W</span>
                    <span class="nav-label">Watermelons</span>
                </span>
            </a>

            <a href="/games/" class="nav-link">
                <span class="nav-item-left">
                    <span class="nav-icon">G</span>
                    <span class="nav-label">Games</span>
                </span>
            </a>
        </aside>

        <div class="main-wrapper">
            <header>
                <button class="toggle-btn" onclick="lightmode()">Light Mode</button>
            </header>

            <div class="Main">
                <h1>Website</h1>
                <p>This is a text confirming the working status of the saloraxz.com domain and its server(s)</p>
            </div>
        </div>

        <script>
            function lightmode() {
                var element = document.body;
                element.classList.toggle("light-mode");
            }
        </script>
    </body>
</html>
